<div class="shell">
  <!-- ── Mobile header ── -->
  <header class="mobile-header">
    <button class="hamburger" (click)="toggleNav()" aria-label="Open menu">&#9776;</button>
    <img src="reimagine.png" alt="Insights Hub" class="mobile-logo-img" />
    <span class="mobile-logo-name">INSIGHTS HUB</span>
  </header>

  <!-- ── Nav backdrop ── -->
  <div class="nav-backdrop" [class.active]="navOpen()" (click)="closeNav()"></div>

  <!-- ── Navigation ── -->
  <nav class="nav" [class.nav-open]="navOpen()">
    <div class="nav-logo">
      <img src="reimagine.png" alt="Reimagine logo" class="nav-logo-img" />
      <div class="nav-logo-name">INSIGHTS HUB</div>
      <div class="nav-logo-sub">TRADE ME · PRODUCT</div>
    </div>

    @for (item of primaryNav; track item.route) {
      <a class="nav-item"
         [routerLink]="item.route"
         routerLinkActive="active"
         (click)="closeNav()">
        {{ item.label }}
      </a>
    }

    <div class="nav-divider"></div>

    @for (item of secondaryNav; track item.route) {
      <a class="nav-item"
         [routerLink]="item.route"
         routerLinkActive="active"
         (click)="closeNav()">
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- ── Main content ── -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
